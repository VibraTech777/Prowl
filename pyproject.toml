[project]
name = "prowl"
version = "0.1.0"
description = "Open-source OSINT reconnaissance tool for pentesters"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["osint", "pentest", "recon", "security", "kali"]
dependencies = [
    "httpx==0.27.2",
    "typer==0.12.5",
    "click==8.1.7",
    "rich==13.9.4",
    "python-dotenv==1.0.1",
    "beautifulsoup4==4.12.3",
    "lxml>=5.3.0",
    "python-whois==0.9.5",
    "dnspython==2.7.0",
    "weasyprint==62.3",
    "pydyf==0.10.0",
    "jinja2==3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
prowl = "cli.main:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "cli*", "reports*"]

[tool.setuptools.package-data]
"reports" = ["templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
